# Manual corrections to the extracted evidence (CLAUDE.md sections 2 and 6.3).
#
# Selectors: every entry names exactly one evidence item by {document_id, page, text_prefix}.
#   text_prefix is compared with the item's text lowercased, with whitespace collapsed and "₹" read as
#   the backtick the Care/HDFC PDFs use. It must equal the whole text when shorter than 40 characters,
#   otherwise the text must start with it. item_type / row_label narrow the match when texts repeat.
#   evidence_id is only a hint: if the item's ID has changed, a warning is logged.
#   Loading fails if an entry matches no item or several items.
#
# supplements: new evidence items read from the PDF text layer inside `region`
#   (x0, y0, x1, y1 in PDF points, top-left origin, as PyMuPDF reports them). The selector names the
#   anchor item they belong to; they inherit its section, table, row label and footnote markers.
#   Created during annotation (scripts/extract_policies.py), with IDs continuing their page's sequence.
#
# overrides: annotation labels applied at load time (benefit_tier, variant, si_condition,
#   linked_footnote_ids, citable). Text is never changed.

